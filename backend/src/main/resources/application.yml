server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: crbot
  datasource:
    url: ${CRBOT_DB_URL:jdbc:postgresql://localhost:5432/crbot}
    username: ${CRBOT_DB_USER:crbot}
    password: ${CRBOT_DB_PASSWORD:crbot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

crbot:
  demo-enabled: ${CRBOT_DEMO_ENABLED:false}
  jwt-secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-32}
  admin-username: ${CRBOT_ADMIN_USERNAME:admin}
  admin-password: ${CRBOT_ADMIN_PASSWORD:admin123}
  gitlab-base-url: ${GITLAB_BASE_URL:}
  gitlab-token: ${GITLAB_TOKEN:}
  gitlab-webhook-secret: ${GITLAB_WEBHOOK_SECRET:}
  llm-base-url: ${LLM_BASE_URL:}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL:}
  embedding-base-url: ${EMBEDDING_BASE_URL:}
  embedding-model: ${EMBEDDING_MODEL:}
  embedding-api-key: ${EMBEDDING_API_KEY:}
  enc-key: ${CRBOT_ENC_KEY:}
  cors-origins: ${CRBOT_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost}
  repo-dir: ${CRBOT_REPO_DIR:data/repos}

logging:
  level:
    com.company.crbot: INFO
